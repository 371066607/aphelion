<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Aphelion 视觉验证实验台</title>
<style>html,body{margin:0;background:#17231e;color:#f4ead5;font:14px system-ui}header{position:fixed;z-index:4;top:0;left:0;right:0;background:#18251eea;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}button{font:inherit;background:#3e6054;color:white;border:1px solid #b8d3b1;border-radius:5px;padding:5px 9px;cursor:pointer}button:focus{outline:2px solid #ffcb72}#status{max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}iframe{position:absolute;top:88px;left:0;width:1440px;height:900px;border:0}#report{position:fixed;bottom:8px;right:8px;z-index:4;width:min(420px,42vw);max-height:38vh;overflow:auto;background:#12201bed;border:1px solid #789482;padding:10px;white-space:pre-wrap;font:12px/1.35 ui-monospace,monospace}</style></head>
<body><header><strong>视觉实验台 · 仅测试</strong><select id="version" aria-label="构建版本"><option value="isolated">当前构建</option><option value="baseline">基线 4658e35</option></select><button id="fresh">固定 seed 新档</button><button id="day">白天</button><button id="dusk">黄昏</button><button id="night">夜晚</button><button id="pause">暂停/继续</button><button id="camera">固定镜头</button><button id="rooms">卧室＋工坊夹具</button><button id="perf">20 人性能采样</button><button id="reload">读档/刷新画布</button><button id="survival">正式施工样板</button><button id="advance">推进模拟 5 分钟</button><button id="export">导出状态</button><button id="reportToggle">隐藏/显示报告</button><span id="status" role="status"></span></header><iframe id="game" title="正式游戏" src="about:blank"></iframe><pre id="report" aria-label="状态 JSON"></pre>
<script>
'use strict';
// This page is intentionally outside build.py. Serve it only at localhost:8766.
const frame=document.getElementById('game'),status=document.getElementById('status'),report=document.getElementById('report');
const result={fixture:'none',seed:58098};
// The formal bundle runs unchanged, but this test-only frame never receives browser storage.
const nativeSnapshot=JSON.stringify(Object.keys(localStorage).sort().map(k=>[k,localStorage.getItem(k)]));
const memoryStore=new Map();window.labStorage={getItem:k=>memoryStore.has(String(k))?memoryStore.get(String(k)):null,setItem:(k,v)=>memoryStore.set(String(k),String(v)),removeItem:k=>memoryStore.delete(String(k)),clear:()=>memoryStore.clear(),key:i=>Array.from(memoryStore.keys())[i]||null,get length(){return memoryStore.size}};
let gameSource='isolated';
function reloadGame(){frame.src='../tests/'+document.getElementById('version').value+'-game.html?autostart=1&debugkeys=1&reload='+Date.now();}
async function bootLab(){guard();reloadGame();}

function guard(){if(location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')throw Error('仅供本地测试');if(location.port!=='8766')throw Error('请使用 localhost:8766 隔离测试存档');}
function game(){guard();const w=frame.contentWindow,a=w&&w.APH;if(!w||!w.APH_LAB_STORAGE)throw Error('需要 tests/serve_visual_lab.py 的内存存储隔离');if(!a||!a.state||!a.Main||a.state.mode!=='running'||!a.state._worldReady)throw Error('正式游戏仍在启动');return a;}
function note(value){status.textContent=value;return value;}
function terrainSummary(a){const t=a.World.stats(),d=t.descriptor||{};return {cacheSize:t.cacheSize,cacheLimit:t.cacheLimit,hits:t.hits,misses:t.misses,width:t.width,height:t.height,grid:d.grid,seed:d.seed,generation:d.generation}}
function present(extra){const a=game(),s=a.state,scene=s.colony&&s.colony.scene,nonResidents=(s.entities||[]).filter(e=>e.type!==a.CFG.entType.RESIDENT&&!e.dead);const data={build:document.getElementById('version').value,viewport:{width:frame.clientWidth,height:frame.clientHeight,dpr:frame.contentWindow.devicePixelRatio},nativeStorageUnchanged:nativeSnapshot===JSON.stringify(Object.keys(localStorage).sort().map(k=>[k,localStorage.getItem(k)])),storage:'memory-only; native localStorage untouched',rooms:a.Nav.roomsOf(s.colony.buildings,s.colony.scene).map(r=>({type:r.type,area:r.cells&&r.cells.length})),residentsState:s.meta.residents.map(r=>({id:r.id,job:r.job,bedId:r.bedId,sleeping:r.isSleeping,food:r.food,rest:r.rest})),queue:s.colony.buildQueue.length,available:['wood','stone','iron','food'].map(k=>[k,a.Colony.stockOf(s.meta.res,s.entities,k)]),label:'tests/visual_lab.html; no survival acceptance from fixtures',fixture:result.fixture,seed:scene&&scene.seed,mode:s.mode,scene:s.scene,clock:s.clock,dayFraction:+((s.clock%a.CFG.DAY_LEN)/a.CFG.DAY_LEN).toFixed(3),paused:s.paused,camera:{x:s.camX,y:s.camY,zoom:s.zoom},residents:s.meta.residents.length,buildings:s.colony.buildings.length,nonResidentObjects:nonResidents.length,entities:s.entities.length,terrain:terrainSummary(a),main:a.Main.debugState(),...extra};report.textContent=JSON.stringify(data,null,2);return data;}
async function ready(){for(let i=0;i<160;i++){try{const a=frame.contentWindow.APH;if(a&&a.Main&&a.state&&a.state.mode==='intro'){a.state.debugKeys=true;a.state.debugTools=true;a.Main.start()}return game()}catch{}await new Promise(r=>setTimeout(r,100))}throw Error('正式游戏未就绪')}
async function action(fn){try{note('执行中…');const v=await fn();present(v&&typeof v==='object'?v:{});note('完成');}catch(e){note('失败: '+e.message);report.textContent=String(e.stack||e)}}
function click(id,fn){document.getElementById(id).addEventListener('click',()=>action(fn))}
click('fresh',async()=>{const a=await ready();if(!a.Save||!a.Save.wipeAll||!a.Save.loadColony)throw Error('存档 API 缺失');a.state.paused=true;a.Save.wipeAll();a.state.meta=a.Save.loadMeta();const w=frame.contentWindow,native=w.Date.now;let c;try{w.Date.now=()=>1700000058098;c=a.Save.loadColony()}finally{w.Date.now=native}if(c.scene.seed!==58098)throw Error('固定种子建立失败 '+c.scene.seed);const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));reloadGame();await loaded;await ready();result.fixture='ordinary fresh home';const s=game().state;s.devFreeBuild=false;if(s.meta.residents.length!==3||s.colony.buildings.length!==0)throw Error('普通新档预期 3 人、0 建筑');return {ordinaryNewGame:true}});
for(const [id,fraction] of [['day',.25],['dusk',.48],['night',.75]])click(id,()=>{const a=game();a.state.clock=a.CFG.DAY_LEN*fraction;a.state.paused=true;return {time:id}});
click('pause',()=>{const a=game();a.state.paused=!a.state.paused;return {paused:a.state.paused}});
click('camera',()=>{const a=game();a.state.camX=1248;a.state.camY=1248;a.state.px=1248;a.state.py=1248;a.state.paused=true;return {cameraFixed:true}});
function roomItems(ox,oy,floors,workshop){const items=[],width=workshop?6:5,height=6;for(let y=0;y<height;y++)for(let x=0;x<width;x++){
 if(y===0||y===height-1||x===0||x===width-1)items.push([y===height-1&&x===2?'bl_gate':'bl_wall',(ox+x)*48,(oy+y)*48,0]);
 else if(floors)items.push(['bl_floor',(ox+x)*48,(oy+y)*48,0]);}
 return items.concat(workshop?[['bl_workshop',(ox+1)*48,(oy+1)*48,0],['bl_dining_table',(ox+2)*48,(oy+3)*48,0],['bl_dining_chair',(ox+1)*48,(oy+3)*48,3]]:[['bl_bed',(ox+1)*48,(oy+1)*48,0],['bl_bed',(ox+2)*48,(oy+1)*48,1],['bl_bed',(ox+3)*48,(oy+3)*48,2]]);}
function findRoomSite(a,floors){const s=a.state,trial={...s,colony:{...s.colony,buildings:s.colony.buildings.slice(),buildQueue:[]}},all=[],sites=[],candidates=[],failures={};for(let y=13;y<31;y++)for(let x=13;x<31;x++)candidates.push([x,y]);candidates.sort((a,b)=>(a[0]-18)**2+(a[1]-18)**2-((b[0]-18)**2+(b[1]-18)**2));for(const workshop of [false,true]){let found=false;for(const [ox,oy] of candidates){const items=roomItems(ox,oy,floors,workshop),previous=trial.colony.buildings.slice();let ok=true;for(const [id,x,y,r] of items){const g=a.Construction.ghost(trial,id,x,y,r);if(!g.ok){failures[id+':'+g.why]=(failures[id+':'+g.why]||0)+1;ok=false;break}trial.colony.buildings.push(g.record)}if(ok){all.push(...items);sites.push([ox,oy]);found=true;break}trial.colony.buildings=previous}if(!found)throw Error('没有可容纳房间的天然空地；'+JSON.stringify({sites,failures}))}return {items:all,sites,ox:(sites[0][0]+sites[1][0])/2-3.5,oy:(sites[0][1]+sites[1][1])/2-1};}
click('rooms',async()=>{const a=game(),s=a.state;s.paused=true;s.devFreeBuild=true;const site=findRoomSite(a,true),items=site.items,before=s.colony.buildings.length;s.camX=(site.ox+6.5)*48;s.camY=(site.oy+4)*48;for(const [id,x,y,rotation] of items){s.buildRotation=rotation;a.Main.tryPlace(id,x,y);await new Promise(r=>setTimeout(r,0))}result.fixture='free-build two enclosed rooms; natural objects preserved; not survival';if(s.colony.buildings.length-before!==items.length)throw Error('房间夹具未完整放置');return {freeBuild:true,site:[site.ox,site.oy],requested:items.length,placed:s.colony.buildings.length-before,bedRotations:s.colony.buildings.filter(b=>b.id==='bl_bed').map(b=>b.rotation)}});

document.getElementById('version').addEventListener('change',()=>action(async()=>{memoryStore.clear();const loaded=new Promise(r=>frame.addEventListener('load',r,{once:true}));reloadGame();await loaded;await ready();return {version:document.getElementById('version').value}}));
click('reload',async()=>{const loaded=new Promise(r=>frame.addEventListener('load',r,{once:true}));reloadGame();await loaded;await ready();return {restored:true}});
click('survival',()=>{const a=game(),s=a.state;if(s.colony.buildings.length||s.colony.buildQueue.length||s.meta.residents.length!==3)throw Error('先固定 seed 新档');s.devFreeBuild=false;s.paused=true;const site=findRoomSite(a,true);for(const [id,x,y,r] of site.items){s.buildRotation=r;a.Main.tryPlace(id,x,y)}s.designations=s.designations||{};const natural=s.entities.filter(e=>e.type===a.CFG.entType.FLORA&&!e.dead).sort((a,b)=>Math.hypot(a.x-1100,a.y-1100)-Math.hypot(b.x-1100,b.y-1100));for(const [kind,n] of [['tree',36],['rock_stone',48],['bush_berry',25],['rock_iron',12]])natural.filter(e=>e.kind===kind).slice(0,n).forEach(e=>{s.designations[e.id]={type:kind.startsWith('rock')?'mine':'chop',entityId:e.id}});s.camX=(site.ox+6.5)*48;s.camY=(site.oy+4)*48;result.fixture='scripted ordinary planning and designations; original resources, skills, needs, simulation';return {planned:s.colony.buildQueue.length,freeBuild:false}});
click('advance',async()=>{const a=game(),s=a.state;if(s.devFreeBuild)throw Error('先创建正式施工样板');const start=s.clock;s.timeScale=1;for(let i=0;i<6000&&s.mode==='running';i++){s.paused=false;a.Main.simStep(.05);s.paused=true;if(i%100===0){note('正式模拟 '+Math.round(s.clock-start)+' / 300 秒');await new Promise(r=>setTimeout(r,0))}}return {simulatedSeconds:s.clock-start}});

function stats(values){const sorted=values.slice().sort((a,b)=>a-b);const n=p=>+(sorted[Math.max(0,Math.ceil(sorted.length*p)-1)]||0).toFixed(3);return {samples:values.length,median:n(.5),p95:n(.95),max:n(1)}}
click('perf',async()=>{const a=game(),s=a.state;if(!a.Res.generate||!a.Main.syncResidents||!a.World.stats||!a.Main.debugState)throw Error('性能夹具 API 缺失');if(s.colony.scene.seed!==58098)throw Error('先生成固定 seed 新档');const names=[];s.meta.residents=[];while(s.meta.residents.length<20){const i=s.meta.residents.length,r=a.Res.generate('visual_lab_'+i,77000+i,names);names.push(r.name);r.worldId='home';r.dead=false;r.downed=false;r.medLying=false;r.isSleeping=false;r.hp=r.hp==null?100:r.hp;r.food=100;r.rest=100;r.recreation=100;s.meta.residents.push(r)}s.paused=false;s.timeScale=1;a.Main.syncResidents();const worldObjects=s.entities.filter(e=>e.type!==a.CFG.entType.RESIDENT&&!e.dead).length;if(Math.abs(worldObjects-2000)>300)throw Error('自然对象偏离约 2000: '+worldObjects);const w=frame.contentWindow,native=w.requestAnimationFrame.bind(w),costs=[],intervals=[];let previous=null,warmup=10,seen=0;const before=a.Main.debugState(),clockBefore=s.clock;try{await new Promise((resolve,reject)=>{w.requestAnimationFrame=function(callback){return native(function(t){if(callback&&callback.name==='frame'){const start=w.performance.now();callback(t);costs.push(w.performance.now()-start)}else callback(t)})};function sample(t){if(previous!==null){if(warmup>0)warmup--;else intervals.push(t-previous)}previous=t;seen++;if(costs.length>=130&&intervals.length>=120){resolve();return}if(seen>360){reject(Error('未采到 120 帧正式主循环'));return}native(sample)}native(sample)})}finally{w.requestAnimationFrame=native}result.fixture='20-resident performance; natural world preserved';const advanced=a.Main.debugState().frameN-before.frameN;if(advanced<120||s.clock<=clockBefore)throw Error('正式模拟没有推进');return {frameCostMs:stats(costs.slice(10,130)),frameIntervalMs:stats(intervals.slice(0,120)),gameFramesAdvanced:advanced,simulationSecondsAdvanced:+(s.clock-clockBefore).toFixed(3),terrainCache:terrainSummary(a),worldObjects,residents:s.meta.residents.length}});
document.getElementById('reportToggle').addEventListener('click',()=>{report.style.display=report.style.display==='none'?'':'none'});click('export',()=>present({exportedAt:new Date().toISOString()}));frame.addEventListener('load',()=>{if(!gameSource)return;ready().then(()=>{note('正式游戏已就绪');present()}).catch(e=>note(e.message));});
bootLab().catch(e=>note(e.message));
</script></body></html>
